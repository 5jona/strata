[workspace]

[package]
name = "strata-debug-agent"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Pure-Rust static Linux/Android on-device debugging agent for Strata"

[[bin]]
name = "strata-debug"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fast_image_resize = "6.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
quick-xml = "0.42"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
await_holding_lock = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
