[tools]
android-sdk = "23.0"
pnpm = "12.22.0"

[env]
CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "{{config_root}}/scripts/aarch64-android-linker.sh"

[task_config]
dir = "{{config_root}}"

[tasks."contracts:gen"]
description = "Regenerate Rust, TypeScript, and JSON Schema contracts from contracts/*.contract.json"
run = "webui/node_modules/.bin/pochita-contracts-gen generate contracts/*.contract.json"

[tasks."contracts:check"]
description = "Verify generated contracts have zero drift and validate golden wire fixtures"
run = "webui/node_modules/.bin/pochita-contracts-gen check contracts/*.contract.json && webui/node_modules/.bin/pochita-contracts-gen validate-fixtures contracts/schemas/strata.schema.json contracts/fixtures"

[tasks."rust:check"]
description = "Run Rust fmt check, clippy (-D warnings), and workspace unit tests"
run = "cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

[tasks."webui:check"]
description = "Lint, typecheck, build, and test Strata SideVeil plugin WebUI"
dir = "{{config_root}}/webui"
run = "pnpm check"

[tasks."webui:format"]
description = "Format and auto-fix Strata WebUI files with Biome"
dir = "{{config_root}}/webui"
run = "pnpm format"

[tasks."python:check"]
description = "Syntax-check Python tools and run host-side unit tests for strata-debug"
run = "python3 -m py_compile container/strata-debug/*.py scripts/strata-debug-mcp.py scripts/strata_mcp/*.py scripts/verify-live.py scripts/verify_live/*.py tests/*.py && python3 -m unittest discover -s tests -v"

[tasks.check]
description = "Run full contract, Rust, WebUI, and Python quality gates"
depends = ["contracts:check", "rust:check", "webui:check", "python:check"]

[tasks.format]
description = "Format Rust workspace with rustfmt"
run = "cargo fmt --all"

[tasks.build]
description = "Cross-compile stratad and strata CLI for aarch64-linux-android"
run = "cargo build --release --target aarch64-linux-android -p stratad -p strata-ctl"

[tasks.archive]
description = "Build release binaries and package KernelSU archive out/strata.zip"
run = "bash build.sh"

[tasks.reload]
description = "Build and hot-reload Strata onto connected Android device"
run = "bash reload.sh"

[tasks.clean]
description = "Remove Rust target directory, staged binaries, and output archive"
run = "rm -rf target out bin/stratad bin/strata"
