name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts-and-webui:
    name: Contracts & WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        run: pnpm --dir webui install --frozen-lockfile

      - name: Check contracts and validate golden fixtures
        run: |
          webui/node_modules/.bin/pochita-contracts-gen check contracts/*.contract.json
          webui/node_modules/.bin/pochita-contracts-gen validate-fixtures contracts/schemas/strata.schema.json contracts/fixtures

      - name: Run WebUI quality gates
        run: pnpm --dir webui check

  rust:
    name: Rust (Daemon & Tools)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon
            tools/strata-debug-agent
            tools/strata-mcp

      - name: Check daemon workspace (fmt, clippy, test)
        working-directory: daemon
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Check strata-debug-agent (fmt, clippy, test, static musl build)
        working-directory: tools/strata-debug-agent
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release --target aarch64-unknown-linux-musl
          if readelf -l target/aarch64-unknown-linux-musl/release/strata-debug | grep -q 'INTERP'; then
            echo "Error: strata-debug binary contains PT_INTERP" >&2
            exit 1
          fi

      - name: Check strata-mcp (fmt, clippy, test)
        working-directory: tools/strata-mcp
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  desktop:
    name: Desktop (Frontend & Tauri Rust)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Run Desktop frontend checks
        run: pnpm --dir desktop check

      - name: Check Desktop Rust workspace (fmt, clippy, test)
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  version-and-scripts:
    name: Version Parity & Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check cross-stack version parity
        run: node scripts/bump-version.mjs --check

      - name: Syntax-check shell and helper scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh module/*.sh module/container/setup-container.sh
          python3 -m py_compile scripts/verify-live.py scripts/verify_live/*.py
