name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts-and-webui:
    name: Contracts & WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        run: pnpm --dir webui install --frozen-lockfile

      - name: Check contracts and validate golden fixtures
        run: |
          webui/node_modules/.bin/pochita-contracts-gen check contracts/*.contract.json
          webui/node_modules/.bin/pochita-contracts-gen validate-fixtures contracts/schemas/strata.schema.json contracts/fixtures

      - name: Run WebUI quality gates
        run: pnpm --dir webui check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --workspace

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check Python sources
        run: |
          python3 -m py_compile \
            container/strata-debug/*.py \
            scripts/strata-debug-mcp.py \
            scripts/strata_mcp/*.py \
            scripts/verify-live.py \
            scripts/verify_live/*.py \
            tests/*.py

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
