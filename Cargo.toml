[workspace]
resolver = "3"
members = [
    "crates/strata-protocol",
    "crates/strata-sys",
    "crates/strata-runtime",
    "crates/stratad",
    "crates/strata-ctl",
]
default-members = ["crates/stratad", "crates/strata-ctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sideveil-plugin-sdk = { git = "https://github.com/5jona/sideveil.git", tag = "v0.1.0" }
sideveil-protocol = { git = "https://github.com/5jona/sideveil.git", tag = "v0.1.0" }
strata-protocol = { path = "crates/strata-protocol" }
strata-runtime = { path = "crates/strata-runtime" }
strata-sys = { path = "crates/strata-sys" }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
await_holding_lock = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
